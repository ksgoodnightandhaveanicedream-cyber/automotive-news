<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自動車用語 単語帳</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>自動車用語 単語帳</h1>
  <p class="muted"><a href="index.html">← ニュース一覧に戻る</a></p>
</header>

<div id="screen-list">
  <div class="controls">
    <input id="search" type="search" placeholder="用語または意味で検索...">
    <select id="category-filter" class="category-select">
      <option value="">すべてのカテゴリ</option>
    </select>
    <p id="word-count" class="muted"></p>
  </div>

  <main id="word-list"></main>
</div>

<div id="screen-detail" class="hidden">
  <p class="muted"><a href="#" id="detail-back">← 一覧に戻る</a></p>
  <div class="detail-term" id="detail-term"></div>
  <div class="word-category" id="detail-category"></div>
  <div class="detail-meaning" id="detail-meaning"></div>

  <div class="detail-related hidden" id="detail-related">
    <div class="detail-related-title">関連する用語</div>
    <div id="detail-related-list"></div>
  </div>
</div>

<script src="data/words.js"></script>
<script src="tango.js"></script>
</body>
</html>
